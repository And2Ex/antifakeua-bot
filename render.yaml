services:
  - type: web
    name: antifakeua-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run_webhook.py
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.4-mini
      - key: ADMIN_IDS
        sync: false
      - key: CHANNEL_ID
        value: '@AntiFakeUA'
      - key: BASE_WEBHOOK_URL
        sync: false
      - key: GITHUB_URL
        value: https://github.com/And2Ex/AntiFakeUA_Bot
      - key: METHODOLOGY_URL
        value: https://github.com/And2Ex/AntiFakeUA_Bot/blob/main/METHODOLOGY.md
      - key: FREE_TEXT_LIMIT
        value: '30'
      - key: LIQPAY_PUBLIC_KEY
        sync: false
      - key: LIQPAY_PRIVATE_KEY
        sync: false
      - key: LIQPAY_SANDBOX
        value: '1'
      - key: PAYMENT_RESULT_URL
        value: https://t.me/AntiFakeUA_Bot
      - key: SUPPORT_JAR_URL
        sync: false
